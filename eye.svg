      <text x="444" y="114" transform="rotate(8, 444, 114)">1011</text>
      <text x="492" y="118" transform="rotate(19, 492, 118)">0101</text>
      <text x="542" y="128" transform="rotate(29, 542, 128)">1101</text>
      <text x="592" y="144" transform="rotate(38, 592, 144)">0110</text>
