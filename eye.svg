  <g class="lower-lid">
    <path d="M 190,278 L 218,278 C 268,308 350,332 458,332 C 565,332 652,298 702,248 L 725,248 L 725,400 L 190,400 Z" fill="#211008" />
    <path d="M 190,278 L 218,278 C 268,308 350,332 458,332 C 565,332 652,298 702,248 L 725,248 L 725,400 L 190,400 Z" fill="url(#skinMatrix)" />

