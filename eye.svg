      <g transform="translate(462, 245)" class="iris-shimmer">
        <g transform="rotate(0)"><text x="29" y="3" class="b t-xs iris-scarlet">1011010110</text></g>
        <g transform="rotate(20)"><text x="29" y="3" class="b t-xs iris-crimson">0110101101</text></g>
        <g transform="rotate(40)"><text x="29" y="3" class="b t-xs iris-scarlet">1101001011</text></g>
        <g transform="rotate(60)"><text x="29" y="3" class="b t-xs iris-core-glow">1010110101</text></g>
        <g transform="rotate(80)"><text x="29" y="3" class="b t-xs iris-crimson">0101101010</text></g>
        <g transform="rotate(100)"><text x="29" y="3" class="b t-xs iris-scarlet">1101001011</text></g>
        <g transform="rotate(120)"><text x="29" y="3" class="b t-xs iris-crimson">0010110100</text></g>
        <g transform="rotate(140)"><text x="29" y="3" class="b t-xs iris-scarlet">1011010110</text></g>
        <g transform="rotate(160)"><text x="29" y="3" class="b t-xs iris-core-glow">0110101101</text></g>
        <g transform="rotate(180)"><text x="29" y="3" class="b t-xs iris-scarlet">1101001011</text></g>
        <g transform="rotate(200)"><text x="29" y="3" class="b t-xs iris-crimson">1010110101</text></g>
        <g transform="rotate(220)"><text x="29" y="3" class="b t-xs iris-scarlet">0101101010</text></g>
        <g transform="rotate(240)"><text x="29" y="3" class="b t-xs iris-crimson">1101001011</text></g>
        <g transform="rotate(260)"><text x="29" y="3" class="b t-xs iris-scarlet">0010110100</text></g>
        <g transform="rotate(280)"><text x="29" y="3" class="b t-xs iris-core-glow">1011010110</text></g>
        <g transform="rotate(300)"><text x="29" y="3" class="b t-xs iris-crimson">0110101101</text></g>
        <g transform="rotate(320)"><text x="29" y="3" class="b t-xs iris-scarlet">1101001011</text></g>
        <g transform="rotate(340)"><text x="29" y="3" class="b t-xs iris-crimson">1010110101</text></g>

        <circle cx="0" cy="0" r="38" fill="none" stroke="#ff4529" stroke-width="2.5" stroke-dasharray="3 2" opacity="0.85" />
      </g>

      <circle cx="462" cy="245" r="87" fill="url(#irisDepth)" />

      <g class="pupil-dynamic">
        <circle cx="462" cy="245" r="30" fill="#040101" />
        <text x="441" y="236" class="b t-xs pupil">0000000</text>
        <text x="438" y="245" class="b t-xs pupil">00010000</text>
        <text x="441" y="254" class="b t-xs pupil">0000000</text>
      </g>

      <g clip-path="url(#glintClip)" class="glint-breath">
        <rect x="470" y="188" width="68" height="58" fill="#ffffff" opacity="0.22" />
        <text x="474" y="198" class="b t-xs glint-main">1011101101</text>
        <text x="472" y="207" class="b t-xs glint-main">0111111011</text>
        <text x="474" y="216" class="b t-xs glint-main">1101111101</text>
        <text x="478" y="225" class="b t-xs glint-main">011111110</text>
        <text x="484" y="234" class="b t-xs glint-soft">10111101</text>
        <path d="M 482,190 Q 485,204 483,212 M 490,190 Q 493,205 491,214 M 498,191 Q 501,206 499,215 M 506,193 Q 509,207 507,216 M 514,196 Q 517,209 515,217 M 522,200 Q 524,212 522,219" stroke="#1c0808" stroke-width="1.6" fill="none" opacity="0.85" />
      </g>

      <text x="432" y="272" class="b t-xs glint-soft" opacity="0.7">101</text>
    </g>

    <rect x="210" y="145" width="500" height="200" fill="url(#eyeballSphere)" />
    <path d="M 215,150 C 350,132 540,145 705,248 L 705,198 C 565,165 360,152 218,265 Z" fill="#0a0302" opacity="0.62" />
  </g>

  <path d="M 255,294 C 345,326 485,334 615,292" fill="none" stroke="#9e645e" stroke-width="5.5" opacity="0.7" />
  <text x="385" y="324" class="b t-xs waterline-shine" opacity="0.9">1011011011101101101</text>

  <g class="upper-lid">
    <path d="M 190,105 L 725,105 L 725,252 C 655,212 578,167 475,160 C 365,152 252,195 218,278 L 190,278 Z" fill="#211008" />
    <path d="M 190,105 L 725,105 L 725,252 C 655,212 578,167 475,160 C 365,152 252,195 218,278 L 190,278 Z" fill="url(#skinMatrix)" />

    <path d="M 255,212 C 325,152 465,134 585,178 C 525,155 375,142 255,212 Z" fill="url(#skinGlowMatrix)" opacity="0.65" />

    <path d="M 225,232 C 275,138 395,108 515,122 C 605,132 668,175 702,216" fill="none" stroke="#1f0d05" stroke-width="7" stroke-dasharray="5 2" />
    <path d="M 235,226 C 285,144 398,116 512,129" fill="none" stroke="#b87856" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.55" />

    <path d="M 222,272 C 260,192 368,151 478,159 C 578,166 655,211 702,248" fill="none" stroke="#0d0402" stroke-width="5.5" />

    <g class="b t-sm lash-core">
      <text x="262" y="212" transform="rotate(-46, 262, 212)">101101</text>
      <text x="288" y="192" transform="rotate(-38, 288, 192)">0110101</text>
      <text x="316" y="176" transform="rotate(-28, 316, 176)">10110101</text>
      <text x="348" y="165" transform="rotate(-18, 348, 165)">010110110</text>
      <text x="382" y="158" transform="rotate(-8, 382, 158)">1101011010</text>
      <text x="418" y="155" transform="rotate(4, 418, 155)">01101011011</text>
      <text x="456" y="156" transform="rotate(14, 456, 156)">101101011011</text>
      <text x="494" y="162" transform="rotate(24, 494, 162)">010110101101</text>
      <text x="532" y="172" transform="rotate(33, 532, 172)">110101101011</text>
      <text x="568" y="185" transform="rotate(41, 568, 185)">011010110101</text>
      <text x="602" y="201" transform="rotate(48, 602, 201)">10110101101</text>
      <text x="634" y="218" transform="rotate(54, 634, 218)">0101101011</text>
      <text x="664" y="234" transform="rotate(60, 664, 234)">11010110</text>
    </g>
    <g class="b t-xs lash-tip">
